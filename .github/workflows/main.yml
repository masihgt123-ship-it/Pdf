name: Create PDF Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.HECTOR }}
          KEY_PASSWORD: ${{ secrets.HECTOR2 }}
        run: |
          set -euo pipefail
          umask 077

          if [ "${#KEYSTORE_PASSWORD}" -lt 16 ] || [ "${#KEY_PASSWORD}" -lt 16 ]; then
            echo "Both passwords must contain at least 16 characters."
            exit 1
          fi

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/pdftools.jks" \
            -storetype JKS \
            -alias pdftools \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -dname "CN=PDF Tools, OU=Mobile, O=PDF Tools" \
            -noprompt

      - name: Save signing key
        uses: actions/upload-artifact@v4
        with:
          name: pdftools-signing-key
          path: ${{ runner.temp }}/pdftools.jks
          retention-days: 1
          if-no-files-found: error

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/pdftools.jks"
