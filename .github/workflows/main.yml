name: Build PDF Tools Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git zip unzip curl \
            autoconf automake libtool libltdl-dev \
            pkg-config cmake build-essential ccache \
            libffi-dev libssl-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo5 gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.5.0 \
            Cython==0.29.36 \
            setuptools \
            wheel

      - name: Download offline OCR language models
        run: |
          mkdir -p tessdata

          for lang in fas eng; do
            curl \
              --fail \
              --location \
              --retry 3 \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/${lang}.traineddata" \
              --output "tessdata/${lang}.traineddata"

            test "$(stat -c%s "tessdata/${lang}.traineddata")" -gt 100000
          done

      - name: Check entry point
        run: |
          test -f main.py
          python -m py_compile main.py

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Tools-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Tools-debug-APK
          path: bin/*.apk
          if-no-files-found: error
